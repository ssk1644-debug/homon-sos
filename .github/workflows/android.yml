name: Android APK

on:
  push:
    paths:
      - 'android-bundle.txt'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack sources
        run: |
          python3 - <<'PY'
          import os, re
          src = open('android-bundle.txt', encoding='utf-8').read()
          parts = re.split(r'^=====FILE: (.+?)=====\n', src, flags=re.M)
          for i in range(1, len(parts), 2):
              p = parts[i].strip()
              os.makedirs(os.path.dirname(p) or '.', exist_ok=True)
              open(p, 'w', encoding='utf-8').write(parts[i + 1])
              print('wrote', p)
          PY

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk homon-sos.apk
          gh release create "apk-${{ github.run_number }}" homon-sos.apk \
            --title "訪問SOS Android テスト版 #${{ github.run_number }}" \
            --notes "テスト用APK（GitHub Actionsで自動作成）" --latest
